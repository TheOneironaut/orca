name: Build Orca RTL

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when this upstream commit is already published
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
      - patches/native-chat-rtl.patch

permissions:
  contents: write

concurrency:
  group: orca-rtl-minimal-builder-v3
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out builder
        uses: actions/checkout@v6

      - name: Resolve exact upstream revision
        id: upstream
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force) }}
        run: |
          $ErrorActionPreference = "Stop"
          $line = git ls-remote https://github.com/stablyai/orca.git refs/heads/main
          if (-not $line) { throw "Unable to resolve stablyai/orca main." }

          $sha = ($line -split "\s+")[0]
          $shouldBuild = $true
          if ($env:FORCE_BUILD -ne "true") {
            $body = gh release view rtl-latest --repo $env:GITHUB_REPOSITORY --json body --jq .body 2>$null
            if ($LASTEXITCODE -eq 0 -and $body -like "*Upstream commit: $sha*") {
              $shouldBuild = $false
            }
            $global:LASTEXITCODE = 0
          }

          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short_sha=$($sha.Substring(0, 9))" >> $env:GITHUB_OUTPUT
          "build=$($shouldBuild.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Record build start
        shell: pwsh
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          BUILD_REQUIRED: ${{ steps.upstream.outputs.build }}
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          New-Item -ItemType Directory -Force -Path .github | Out-Null
          $status = if ($env:BUILD_REQUIRED -eq "true") { "running" } else { "up-to-date" }
          [ordered]@{
            status = $status
            upstream_commit = $env:UPSTREAM_SHA
            run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            updated_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content -Encoding utf8 .github\build-status.json

          git add .github/build-status.json
          git commit -m "ci: record Orca RTL build start"
          git push origin HEAD:main

      - name: Already current
        if: steps.upstream.outputs.build != 'true'
        shell: pwsh
        run: |
          "The latest upstream commit is already published." | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Fetch exact Orca commit
        if: steps.upstream.outputs.build == 'true'
        shell: pwsh
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path orca-src | Out-Null
          git -C orca-src init
          git -C orca-src remote add origin https://github.com/stablyai/orca.git
          git -C orca-src fetch --depth 1 origin $env:UPSTREAM_SHA
          git -C orca-src checkout --detach FETCH_HEAD
          if ((git -C orca-src rev-parse HEAD) -ne $env:UPSTREAM_SHA) {
            throw "The exact upstream commit was not checked out."
          }

      - name: Apply RTL patch
        if: steps.upstream.outputs.build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $patch = Join-Path $env:GITHUB_WORKSPACE "patches\native-chat-rtl.patch"
          git -C orca-src apply --check $patch
          git -C orca-src apply $patch
          git -C orca-src diff --check

      - name: Set up pnpm
        if: steps.upstream.outputs.build == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0
          run_install: false

      - name: Set up Node.js
        if: steps.upstream.outputs.build == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: orca-src/package.json
          cache: pnpm
          cache-dependency-path: orca-src/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.upstream.outputs.build == 'true'
        shell: pwsh
        working-directory: orca-src
        run: |
          pnpm install --no-frozen-lockfile --prefer-frozen-lockfile=false
          git diff --exit-code package.json pnpm-lock.yaml

      - name: Validate patched source
        if: steps.upstream.outputs.build == 'true'
        shell: pwsh
        working-directory: orca-src
        run: |
          pnpm exec oxlint --format github `
            src/renderer/src/components/native-chat/NativeChatComposerField.tsx `
            src/renderer/src/components/sidebar/CommentMarkdown.tsx
          pnpm typecheck

      - name: Build native Windows helpers
        if: steps.upstream.outputs.build == 'true'
        shell: pwsh
        working-directory: orca-src
        run: |
          pnpm run build:native 2>&1 | Tee-Object -FilePath ..\build-native.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

      - name: Build Windows installer
        if: steps.upstream.outputs.build == 'true'
        shell: pwsh
        working-directory: orca-src
        run: |
          $log = "..\build-win.log"

          pnpm run build:desktop 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

          pnpm run ensure:electron-runtime 2>&1 | Tee-Object -FilePath $log -Append
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never 2>&1 | Tee-Object -FilePath $log -Append
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

      - name: Prepare release files
        if: steps.upstream.outputs.build == 'true'
        id: release
        shell: pwsh
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem orca-src\dist -Recurse -File -Filter "orca-windows-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Could not find orca-windows-setup.exe." }

          Copy-Item $installer.FullName release\orca-rtl-windows-setup.exe
          $hash = (Get-FileHash release\orca-rtl-windows-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  orca-rtl-windows-setup.exe" | Set-Content -Encoding ascii release\orca-rtl-windows-setup.exe.sha256
          $env:UPSTREAM_SHA | Set-Content -Encoding ascii release\upstream-commit.txt
          $package = Get-Content orca-src\package.json -Raw | ConvertFrom-Json
          "version=$($package.version)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Publish rolling release
        if: steps.upstream.outputs.build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          UPSTREAM_SHORT_SHA: ${{ steps.upstream.outputs.short_sha }}
          UPSTREAM_VERSION: ${{ steps.release.outputs.version }}
          INSTALLER_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f rtl-latest $env:GITHUB_SHA
          git push origin refs/tags/rtl-latest --force

          $title = "Orca RTL for Windows - $env:UPSTREAM_VERSION ($env:UPSTREAM_SHORT_SHA)"
          $notes = @"
          Automated unsigned Windows build of Orca with Native Chat RTL support.

          Upstream version: $env:UPSTREAM_VERSION
          Upstream commit: $env:UPSTREAM_SHA
          Builder commit: $env:GITHUB_SHA
          Installer SHA-256: $env:INSTALLER_SHA256

          The only source modification is patches/native-chat-rtl.patch.
          Windows SmartScreen may warn because this community build is unsigned.
          "@

          gh release view rtl-latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit rtl-latest --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --prerelease
            gh release upload rtl-latest release\orca-rtl-windows-setup.exe release\orca-rtl-windows-setup.exe.sha256 release\upstream-commit.txt --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            $global:LASTEXITCODE = 0
            gh release create rtl-latest release\orca-rtl-windows-setup.exe release\orca-rtl-windows-setup.exe.sha256 release\upstream-commit.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --notes $notes --prerelease
          }

      - name: Record final status
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          BUILD_REQUIRED: ${{ steps.upstream.outputs.build }}
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -C build-status-work origin/main

          $status = $env:JOB_STATUS
          if ($status -eq "success" -and $env:BUILD_REQUIRED -ne "true") { $status = "up-to-date" }
          [ordered]@{
            status = $status
            upstream_commit = $env:UPSTREAM_SHA
            run_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            updated_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content -Encoding utf8 .github\build-status.json

          $failureLog = ".github\last-build.log"
          if ($status -eq "failure") {
            $chunks = @()
            foreach ($path in @("build-native.log", "build-win.log")) {
              if (Test-Path $path) {
                $chunks += "===== $path ====="
                $chunks += Get-Content $path -Tail 250
              }
            }
            if ($chunks.Count -eq 0) { $chunks = @("No captured build log was available.") }
            $chunks | Set-Content -Encoding utf8 $failureLog
          } elseif (Test-Path $failureLog) {
            Remove-Item $failureLog
          }

          git add -A .github
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "ci: record Orca RTL build $status"
            git push origin HEAD:main
          }
